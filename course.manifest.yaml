    order: 1
    homework: "2235 PRO"
    title: "MONGOOSE TEXT"
    subtitle: "AI-редактор смыслов и тональности текста"
    path: "projects/01-text-meaning-tone-editor"
    manifest: "projects/01-text-meaning-tone-editor/project.manifest.yaml"
    status: needs_inventory
    course_focus:
      - prompt_architecture
      - meaning_preservation
      - communication_goal
      - audience_adaptation
      - tone_control
      - clarification_cycles
      - structured_output
    reusable_assets:
      - transformation_parameter_model
      - clarification_cycle_pattern
      - meaning_preservation_guard
      - prompt_configuration_ui_pattern

  - id: "02-dialogue-ai-assistant"
    order: 2
    homework: "2236 PRO"
    title: "MONGOOSE AI PLATFORM"
    path: "projects/02-dialogue-ai-assistant"
    status: release_candidate
    course_focus:
      - dialogue
      - conversation_history
      - structured_analysis
      - professional_assessment
      - pdf_reports
      - workspace_lite
