    reusable_assets:
      - dialogue_api
      - provider_abstraction
      - analysis_factory
      - report_factory
      - request_tracing
      - safe_document_parsing

  - id: "03-multimodal-action-assistant"
    order: 3
    homework: "2237 PRO"
    title: "MONGOOSE VISION"
    subtitle: "Multimodal Action Assistant"
    path: "projects/03-multimodal-action-assistant"
    status: needs_recovery
    course_focus:
      - image_input
      - voice_input
      - text_input
      - multimodal_context
      - multimodal_analysis
      - suggested_action_buttons
      - action_execution
    depends_on:
      - "01-text-meaning-tone-editor"
      - "02-dialogue-ai-assistant"
    planned_reuse:
      - prompt_configuration_patterns
      - dialogue_history
      - structured_output
      - safety_layer
      - action_protocol

  - id: "04-ai-fitness-trainer"
    order: 4
    homework: "2242 PRO"
    title: "PULSE CARE AI"
    path: "projects/04-ai-fitness-trainer"
    manifest: "projects/04-ai-fitness-trainer/project.manifest.yaml"
    status: in_development
    course_focus:
      - web_ai_assistant
      - fitness_goals
      - metric_journal
      - deterministic_forecast
      - explainable_recommendations
      - synthetic_device_events
      - safety_rules
    depends_on:
      - "01-text-meaning-tone-editor"
      - "02-dialogue-ai-assistant"
      - "03-multimodal-action-assistant"
    reuses:
      - prompt_parameter_patterns
      - ui_shell_patterns
      - ai_chat_patterns
      - structured_output
      - engineering_documentation

agent_read_order:
  - "course.manifest.yaml"
  - "00_STANDARDS/00_KVS_ENGINEERING_STANDARD.yaml"
  - "00_STANDARDS/02_AGENT_CONTEXT_PROTOCOL.md"
  - "projects/<project-id>/project.manifest.yaml"
  - "projects/<project-id>/README.md"
  - "projects/<project-id>/docs/"

update_policy:
  when_project_created:
    - register_in_course_manifest
    - create_project_manifest
    - add_to_root_readme
  when_project_status_changes:
    - update_progress_summary
    - update_root_readme
    - update_project_manifest
  when_architecture_changes:
    - update_project_manifest
    - update_project_journal
    - create_or_update_adr
  when_feature_completed:
    - update_status
    - record_evidence
    - register_reusable_asset
