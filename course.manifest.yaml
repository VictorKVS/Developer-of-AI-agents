schema_version: "1.1"
portfolio:
  id: developer-of-ai-agents
  title: "Developer of AI Agents"
  language: ru
  repository: "VictorKVS/Developer-of-AI-agents"
  model: independent_projects_shared_course_memory
  purpose:
    - course_portfolio
    - independent_project_showcase
    - reusable_agent_architecture
    - machine_readable_engineering_memory
  principles:
    - independent_projects
    - reuse_before_rewrite
    - structured_output
    - deterministic_core
    - verifiable_ai
    - security_by_design
    - synthetic_demo_data

progress:
  registered_projects: 4
  release_candidate: 1
  needs_finalization: 2
  in_development: 1
