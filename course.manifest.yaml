  engineering_standard: "00_STANDARDS/00_KVS_ENGINEERING_STANDARD.yaml"
  project_schema: "00_STANDARDS/01_PROJECT_MANIFEST.schema.json"
  agent_context_protocol: "00_STANDARDS/02_AGENT_CONTEXT_PROTOCOL.md"

projects:
