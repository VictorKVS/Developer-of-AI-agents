architecture:
  stack:
    - React 19
    - Vite
    - TypeScript
    - Google Gemini
    - Recharts
    - localStorage
  modules:
    - Dashboard
    - Goals
    - Metric Journal
    - Forecast Engine
    - AI Coach
    - Safety Engine
    - Mock Device Center
    - Context Event Simulator
    - Notification Engine
  data_flows:
    - synthetic data -> normalization -> deterministic forecast -> safety rules -> AI explanation
    - mock device event -> event bus -> notification policy -> user message
  constraints:
    - no real medical data in public demo
    - no diagnosis or treatment
    - deterministic calculations for numeric forecast
    - LLM explains but does not invent forecast values
    - explicit distinction between free, pro, demo and planned functionality

agents:
  - id: coordinator-agent
    goal: Координировать достижение пользовательской цели на основе контекста и правил.
    inputs:
      - goals
      - metric entries
      - synthetic device events
      - health profile demo
      - user notification preferences
    tools:
      - forecast service
      - safety engine
      - notification engine
      - Gemini explanation service
    outputs:
      - daily plan
      - progress summary
      - contextual notification
    guardrails:
      - no diagnosis
      - no treatment
      - safety engine approval required
  - id: forecast-agent
    goal: Рассчитать темп и срок достижения цели проверяемым способом.
    inputs:
      - historical metric values
      - target value
      - goal direction
    tools:
      - linear regression
      - data quality checks
    outputs:
      - estimated date
      - estimated weeks
      - confidence
      - explanation inputs
    guardrails:
      - no LLM arithmetic
      - insufficient-data state required
  - id: safety-agent
    goal: Проверить рекомендацию до показа пользователю.
    inputs:
      - proposed action
      - synthetic health restrictions
      - risk rules
    tools:
      - green yellow red rules
    outputs:
      - allow
      - caution
      - block
      - doctor-review-required
    guardrails:
      - explicit medical limitation disclaimer

