decisions:
  - id: ADR-001
    status: accepted
    decision: Публичная версия использует только синтетические данные.
    reason: Безопасная демонстрация и отсутствие персональных медицинских данных.
    supersedes: null
  - id: ADR-002
    status: accepted
    decision: Прогноз рассчитывается детерминированным модулем, а LLM объясняет готовый результат.
    reason: Проверяемость чисел и защита от галлюцинаций модели.
    supersedes: null
  - id: ADR-003
    status: accepted
    decision: Интеграции с устройствами в v0.1 реализуются через mock providers и synthetic events.
    reason: Веб-ДЗ не требует мобильных HealthKit или Health Connect интеграций.
    supersedes: null
  - id: ADR-004
    status: accepted
    decision: Проект проектируется как Free MVP с документированным Pro roadmap.
    reason: Требования курса закрываются ограниченным законченным продуктом без ложной реализации будущих функций.
    supersedes: null
