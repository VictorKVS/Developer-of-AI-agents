<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диалог — MONGOOSE AI PLATFORM</title>
</head>
<body>
    <div id="csrf-token" data-token="{{ csrf_token }}" hidden></div>

    <header>
        <h1>MONGOOSE AI PLATFORM</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/chat/">Диалоги</a>
            <a href="/admin/">Администрирование</a>
        </nav>
    </header>

    <main>
        <h2>Диалог с AI</h2>
        <section id="messages"><p>Начните новый диалог.</p></section>

        <form id="chat-form">
            <label for="message">Сообщение</label>
            <textarea id="message" name="message" rows="4" maxlength="4000" required></textarea>
            <button type="submit">Отправить</button>
        </form>
        <p id="status"></p>
    </main>

    <script>
        let conversationId = null;
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");
        const status = document.getElementById("status");
        const csrfToken = document.getElementById("csrf-token").dataset.token;

        function appendMessage(role, content) {
            const block = document.createElement("div");
            const title = document.createElement("strong");
            const text = document.createElement("p");
            title.textContent = role === "user" ? "Вы" : "AI";
            text.textContent = content;
            block.appendChild(title);
            block.appendChild(text);
            messages.appendChild(block);
        }

        async function parseError(response, fallback) {
            let detail = fallback;
            try {
                const data = await response.json();
                detail = data.detail || fallback;
            } catch (_) {
                const text = await response.text();
                if (text) detail = text.slice(0, 300);
            }
            const correlationId = response.headers.get("X-Correlation-ID");
            return correlationId
                ? `${detail} [request: ${correlationId}]`
                : detail;
        }

        async function createConversation() {
            const response = await fetch("/api/v1/conversations/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                credentials: "same-origin",
                body: "{}"
            });

            if (!response.ok) {
                throw new Error(await parseError(response, "Не удалось создать диалог."));
            }

            const data = await response.json();
            conversationId = data.public_id;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            input.disabled = true;
            status.textContent = "AI формирует ответ…";

            try {
                if (!conversationId) await createConversation();
                appendMessage("user", message);
                input.value = "";

                const response = await fetch(
                    `/api/v1/conversations/${conversationId}/chat/`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },
                        credentials: "same-origin",
                        body: JSON.stringify({ message })
                    }
                );

                if (!response.ok) {
                    throw new Error(await parseError(response, "Не удалось получить ответ AI."));
                }

                const data = await response.json();
                appendMessage("assistant", data.assistant_message.content);
                status.textContent = "";
            } catch (error) {
                status.textContent = error.message;
            } finally {
                input.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
